# Include inside the existing Guns_demo server block (port 9000).
location = /warehouse {
    return 301 /warehouse/;
}

location ^~ /warehouse/api/ {
    default_type application/json;
    return 503 '{"error":"AI generation is disabled on this deployment"}';
}

location ^~ /warehouse/ {
    alias /opt/web-ai/current/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}
